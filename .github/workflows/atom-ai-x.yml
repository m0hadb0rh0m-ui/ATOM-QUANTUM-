name: ATOM AI X - Android and Backend CI
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test backend
        run: cd backend && pip install -r requirements-dev.txt && python -m pytest -q tests

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        env:
          ATOM_BACKEND_URL: ${{ vars.ATOM_BACKEND_URL }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ATOM-AI-X-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
